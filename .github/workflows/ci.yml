name: ci

# L0 验证层 —— 纯检查、零产物、不触发发布（发布见 release.yml）。
# 触发: push main + 任意 PR；文档/设计类改动不排队。
# 命令: pnpm lint + pnpm typecheck (vue-tsc --noEmit) + pnpm test (全量契约冒烟 8 套件) + pnpm build (vue-tsc --noEmit && vite build)

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 读 package.json packageManager（pnpm@11.10.0）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (全量契约冒烟 8 套件 + 属性测试)
        run: pnpm test

      - name: Build
        run: pnpm build
