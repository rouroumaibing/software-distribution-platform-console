name: ci

# L0 验证层 —— 纯检查、零产物、不触发发布（对齐 docs/ci-build-pipeline.md 的验证/发布分层理念）。
# 触发: push main + 任意 PR；文档/设计类改动不排队。
# 命令: pnpm typecheck (vue-tsc --noEmit) + pnpm test:runcenter (URL 契约冒烟) + pnpm build (vue-tsc --noEmit && vite build)

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'assets/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 读 package.json packageManager（pnpm@11.10.0）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (运行中心 URL 契约)
        run: pnpm test:runcenter

      - name: Build
        run: pnpm build
